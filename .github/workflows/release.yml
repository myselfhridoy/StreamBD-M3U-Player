name: Release

# GitHub-এ Releases -> "Draft a new release" -> নতুন ট্যাগ (যেমন v1.0.1) দিয়ে Publish করলেই এটা চলে।
# ফলাফল: সাইন করা app-release.apk ওই Release-এ যুক্ত হয়, আর
# https://github.com/<owner>/<repo>/releases/latest/download/app-release.apk লিংকে সর্বশেষটা পাওয়া যায়।
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace -PVERSION_NAME="$VERSION_NAME"

      - name: Check the APK is signed and show its certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "app-release.apk not found (is the build signed?)"; ls app/build/outputs/apk/release; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
